<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribe Count</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0b0b12;
  color: white;
  min-height: 100vh;
}

header {
  padding: 22px;
  background: #151520;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  color: #ff3333;
  letter-spacing: 1px;
}

.container {
  max-width: 650px;
  margin: 65px auto;
  padding: 20px;
  text-align: center;
}

h1 {
  font-size: 36px;
  margin-bottom: 12px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 30px;
}

.search {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #191923;
  color: white;
  font-size: 15px;
}

button {
  padding: 15px 20px;
  border: none;
  border-radius: 10px;
  background: #ff3030;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #d91f1f;
}

.card {
  background: #191923;
  border: 1px solid #30303c;
  border-radius: 18px;
  padding: 30px 20px;
}

#thumbnail {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  object-fit: cover;
  display: none;
  margin: 0 auto 15px;
}

#channelName {
  font-size: 23px;
  margin-bottom: 20px;
}

.count-label {
  color: #aaa;
  font-size: 15px;
}

#subscribers {
  font-size: clamp(30px, 8vw, 48px);
  color: #ff3333;
  font-weight: bold;
  margin: 12px 0 25px;
  overflow-wrap: anywhere;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.stat {
  background: #252532;
  padding: 18px 8px;
  border-radius: 12px;
}

.stat h3 {
  font-size: 20px;
  margin-top: 8px;
}

#message {
  color: #ffaaaa;
  margin: 15px 0;
}

footer {
  color: #777;
  text-align: center;
  padding: 25px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>🔴 SUBSCRIBE COUNT</header>

<div class="container">

<h1>YouTube Live Counter</h1>
<p class="subtitle">Track your YouTube channel statistics</p>

<div class="search">
  <input id="handle" placeholder="Enter Channel Handle (@name)">
  <button onclick="getChannel()">Search</button>
</div>

<p id="message"></p>

<div class="card">

<img id="thumbnail" alt="Channel thumbnail">

<h2 id="channelName">Your Channel</h2>

<p class="count-label">Subscribers</p>
<div id="subscribers">---</div>

<div class="stats">
  <div class="stat">
    Total Views
    <h3 id="views">---</h3>
  </div>

  <div class="stat">
    Total Videos
    <h3 id="videos">---</h3>
  </div>
</div>

</div>
</div>

<footer>© 2026 Subscribe Count</footer>

<script>
async function getChannel() {
  const handle = document.getElementById("handle").value.trim();
  const message = document.getElementById("message");

  if (!handle) {
    message.textContent = "Please enter a YouTube handle.";
    return;
  }

  message.textContent = "Loading channel data...";

  try {
    const response = await fetch(
      `/api/channel?handle=${encodeURIComponent(handle)}`
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Unable to find channel");
    }

    document.getElementById("thumbnail").src = data.thumbnail;
    document.getElementById("thumbnail").style.display = "block";

    document.getElementById("channelName").textContent = data.name;
    document.getElementById("subscribers").textContent =
      data.subscribers === "Hidden"
        ? "Hidden"
        : Number(data.subscribers).toLocaleString("en-IN");

    document.getElementById("views").textContent =
      Number(data.views).toLocaleString("en-IN");

    document.getElementById("videos").textContent =
      Number(data.videos).toLocaleString("en-IN");

    message.textContent = "Channel connected successfully!";
  } catch (error) {
    message.textContent = error.message;
  }
}
</script>

</body>
</html>
